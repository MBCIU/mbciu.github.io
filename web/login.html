<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | MBCIU</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script><script src="firebase-config.js"></script>
</head><body class="bg-gradient-to-r from-blue-100 to-purple-100 min-h-screen text-gray-900">
<main class="max-w-md mx-auto pt-12 px-4"><h1 class="text-2xl font-bold mb-6">Login to MBCIU</h1>
<div class="bg-white shadow-xl rounded-xl p-6 space-y-4">
  <input id="email" type="email" autocomplete="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg">
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" class="w-full px-4 py-2 border rounded-lg">
  <button id="emailLogin" class="w-full bg-blue-600 text-white py-2 rounded-lg">Log In</button>
  <button id="resetPassword" class="w-full text-sm text-blue-700 underline">Forgot password?</button>
  <div class="border-t pt-4 text-center text-sm text-gray-500">or</div>
  <button id="googleLogin" class="w-full bg-red-600 text-white py-2 rounded-lg">Continue with Google</button>
  <button id="microsoftLogin" class="w-full bg-gray-800 text-white py-2 rounded-lg">Continue with Microsoft</button>
  <p id="message" role="alert" class="text-sm text-red-700"></p>
  <p class="text-sm text-center">No account? <a href="signup.html" class="text-blue-700 underline">Sign up</a></p>
</div></main>
<script>
const message = document.getElementById("message");
async function authorise(user) {
  if (!user.emailVerified) throw new Error("Verify your email before logging in.");
  if (!await requireApprovedUser(user)) throw new Error("Your account is awaiting administrator approval.");
  window.location.replace("dashboard.html");
}
async function runLogin(action) {
  message.textContent = "";
  try { const result = await action(); await authorise(result.user); }
  catch (error) { await firebase.auth().signOut(); message.textContent = error?.message || "Login failed."; }
}
document.getElementById("emailLogin").addEventListener("click", () => runLogin(() => firebase.auth().signInWithEmailAndPassword(normaliseEmail(document.getElementById("email").value), document.getElementById("password").value)));
document.getElementById("googleLogin").addEventListener("click", () => runLogin(() => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())));
document.getElementById("microsoftLogin").addEventListener("click", () => runLogin(() => firebase.auth().signInWithPopup(new firebase.auth.OAuthProvider("microsoft.com"))));
document.getElementById("resetPassword").addEventListener("click", async () => {
  const email = normaliseEmail(document.getElementById("email").value);
  if (!email) return (message.textContent = "Enter your email address first.");
  try { await firebase.auth().sendPasswordResetEmail(email); message.textContent = "Password-reset email sent."; }
  catch (error) { message.textContent = error?.message || "Unable to send reset email."; }
});
</script></body></html>
