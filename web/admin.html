<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel | MBCIU</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>

  <script>
    emailjs.init("NeoWvdWOFVFsHj6l1");

    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
</head>

<body class="bg-gradient-to-br from-white to-gray-100 dark:from-gray-900 dark:to-black min-h-screen text-gray-900 dark:text-gray-100 transition-all">

  <div class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold">Admin Approval Panel</h1>
      <div class="flex gap-3 items-center">
        <button onclick="toggleDarkMode()" class="text-sm text-blue-500 hover:underline">🌓 Toggle Dark Mode</button>
        <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">Logout</button>
      </div>
    </div>

    <div class="overflow-x-auto bg-white dark:bg-gray-800 rounded-xl shadow-lg">
      <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
        <thead class="bg-gray-100 dark:bg-gray-700">
          <tr>
            <th class="px-6 py-3 text-left text-sm font-semibold">Email</th>
            <th class="px-6 py-3 text-left text-sm font-semibold">Email Verified</th>
            <th class="px-6 py-3 text-left text-sm font-semibold">Approved</th>
            <th class="px-6 py-3 text-left text-sm font-semibold">Tool access</th>
            <th class="px-6 py-3 text-left text-sm font-semibold">Action</th>
          </tr>
        </thead>
        <tbody id="userTable" class="divide-y divide-gray-200 dark:divide-gray-700">
        </tbody>
      </table>
    </div>

    <footer class="mt-10 text-center text-sm text-gray-500 dark:text-gray-400">
      &copy; <span id="year"></span> Warda Syeda | MBCIU
    </footer>
  </div>

  <script>
    function toggleDarkMode() {
      document.documentElement.classList.toggle("dark");
      const isDark = document.documentElement.classList.contains("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    function logout() {
      firebase.auth().signOut().then(() => {
        window.location.href = "/index.html";
      });
    }

    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "/index.html";
        return;
      }

      if (!await userIsAdmin(user)) {
        alert("Access denied: You are not an admin.");
        window.location.href = "/web/dashboard.html";
        return;
      }

      loadUsers();
    });

    function loadUsers() {
      const userTable = document.getElementById("userTable");
      userTable.innerHTML = "";

      db.collection("users").get().then((snapshot) => {
        snapshot.forEach(child => {
          const uid = child.id;
          const data = child.data();

          const row = document.createElement("tr");
          const values = [data.email || "Unknown", "Verified at sign-in", data.approved ? "✅ Yes" : "❌ No"];
          values.forEach(value => {
            const cell = document.createElement("td"); cell.className = "px-6 py-4"; cell.textContent = value; row.appendChild(cell);
          });

          const toolsCell = document.createElement("td");
          toolsCell.className = "px-6 py-4 space-y-1";
          TOOL_IDS.forEach(toolId => {
            const state = data.tools?.[toolId] || {};
            if (!state.requested && !state.approved) return;
            const line = document.createElement("div");
            line.textContent = `${toolId}: ${state.approved ? "approved" : "pending"} `;
            if (state.requested && !state.approved) {
              const button = document.createElement("button");
              button.className = "text-green-700 underline"; button.textContent = "Approve";
              button.addEventListener("click", () => setToolAccess(uid, toolId, true)); line.appendChild(button);
            }
            toolsCell.appendChild(line);
          });
          if (!toolsCell.childElementCount) toolsCell.textContent = "—";
          row.appendChild(toolsCell);

          const actionCell = document.createElement("td"); actionCell.className = "px-6 py-4";
          if (!data.approved) {
            const button = document.createElement("button"); button.className = "text-green-700 underline"; button.textContent = "Approve account";
            button.addEventListener("click", () => approveUser(uid)); actionCell.appendChild(button);
          }
          row.appendChild(actionCell);
          userTable.appendChild(row);
        });
      }).catch(error => alert("Unable to load users: " + error.message));
    }

    async function approveUser(uid) {
      const ref = db.collection("users").doc(uid);
      const snapshot = await ref.get();
      const email = snapshot.data()?.email;
      return ref.update({ approved: true }).then(() => {
        alert("User approved!");
        emailjs.send("service_1tqzrwr", "template_user_approved", {
          email: email
        }).then(() => {
          console.log("Approval email sent to user.");
        }).catch((error) => {
          console.error("EmailJS error:", error);
        });
        loadUsers();
      });
    }

    function setToolAccess(uid, toolId, approved) {
      if (!TOOL_IDS.includes(toolId)) return;
      const update = {};
      update[`tools.${toolId}.approved`] = approved;
      update[`tools.${toolId}.requested`] = false;
      update[`tools.${toolId}.reviewedAt`] = firebase.firestore.FieldValue.serverTimestamp();
      return db.collection("users").doc(uid).update(update).then(loadUsers)
        .catch(error => alert("Unable to update tool access: " + error.message));
    }

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
