<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | MBCIU</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script><script src="firebase-config.js"></script>
</head><body class="bg-gradient-to-r from-blue-100 to-purple-100 min-h-screen text-gray-900">
<main class="max-w-md mx-auto pt-12 px-4"><h1 class="text-2xl font-bold mb-6">Sign Up for MBCIU</h1>
<div class="bg-white shadow-xl rounded-xl p-6 space-y-4">
  <input id="email" type="email" autocomplete="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg">
  <input id="password" type="password" autocomplete="new-password" minlength="12" placeholder="Password (12+ characters)" class="w-full px-4 py-2 border rounded-lg">
  <button id="emailSignup" class="w-full bg-blue-600 text-white py-2 rounded-lg">Sign Up with Email</button>
  <div class="border-t pt-4 text-center text-sm text-gray-500">or</div>
  <button id="googleSignup" class="w-full bg-red-600 text-white py-2 rounded-lg">Continue with Google</button>
  <button id="microsoftSignup" class="w-full bg-gray-800 text-white py-2 rounded-lg">Continue with Microsoft</button>
  <p id="message" role="alert" class="text-sm text-red-700"></p>
  <p class="text-sm text-center">Already registered? <a href="login.html" class="text-blue-700 underline">Log in</a></p>
</div></main>
<script>
const message = document.getElementById("message");
const buttons = [...document.querySelectorAll("button")];
function setBusy(busy) { buttons.forEach(button => button.disabled = busy); }
function showError(error) { message.textContent = error?.message || "Unable to create the account."; }
async function createPendingProfile(user) {
  if (!user?.email) throw new Error("The identity provider did not return an email address.");
  const ref = db.collection("users").doc(user.uid);
  const existing = await ref.get();
  if (!existing.exists) await ref.set({email: normaliseEmail(user.email), approved: false, tools: {}, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
}
async function finishSignup(user, needsVerification) {
  await createPendingProfile(user);
  if (needsVerification) await user.sendEmailVerification();
  await firebase.auth().signOut();
  window.location.replace("signup-success.html");
}
document.getElementById("emailSignup").addEventListener("click", async () => {
  setBusy(true); message.textContent = "";
  try {
    const email = normaliseEmail(document.getElementById("email").value);
    const password = document.getElementById("password").value;
    if (!email || password.length < 12) throw new Error("Enter a valid email and a password of at least 12 characters.");
    const credential = await firebase.auth().createUserWithEmailAndPassword(email, password);
    await finishSignup(credential.user, true);
  } catch (error) { showError(error); setBusy(false); }
});
async function federatedSignup(provider) {
  setBusy(true); message.textContent = "";
  try { const credential = await firebase.auth().signInWithPopup(provider); await finishSignup(credential.user, false); }
  catch (error) { showError(error); setBusy(false); }
}
document.getElementById("googleSignup").addEventListener("click", () => federatedSignup(new firebase.auth.GoogleAuthProvider()));
document.getElementById("microsoftSignup").addEventListener("click", () => federatedSignup(new firebase.auth.OAuthProvider("microsoft.com")));
</script></body></html>
